/* Diseño: "dark luxury" de marca. Negro profundo, oro como único acento, serif de marca para títulos y cifras. Un solo tema oscuro por decisión de marca. */
:root{
  --negro:#0D0D12; --panel:#15151C; --panel2:#1C1C25; --panel3:#23232E; --linea:#2A2A35;
  --oro:#C9A227; --oro-claro:#E2B84A; --oro-suave:rgba(201,162,39,.10);
  --texto:#ECE7DB; --texto2:#A39E92; --texto3:#6E6A62;
  --ok:#5FA77A; --aviso:#D9923B; --mal:#C9584E;
  --a-dir:#D8B85A; --a-con:#7FB3C9; --a-eve:#C99AD6; --a-dig:#9DB4E8;
  --f-titulo:"Cormorant Garamond", Garamond, "Times New Roman", serif;
  --f-texto:"Outfit", "Segoe UI", system-ui, sans-serif;
  --r:10px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--negro);color:var(--texto);font-family:var(--f-texto);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--oro-claro);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-titulo);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}

#acceso::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(13,13,18,.55),rgba(13,13,18,.92))}
.tarjeta-acceso{position:relative;width:100%;max-width:360px;background:rgba(13,13,18,.82);border:1px solid rgba(201,162,39,.35);border-radius:14px;padding:32px 28px;display:flex;flex-direction:column;gap:16px;backdrop-filter:blur(6px)}
.tarjeta-acceso img{width:130px;align-self:center}
.tarjeta-acceso h1{text-align:center;font-size:24px;color:var(--oro-claro)}
.nota-ejemplo{font-size:12px;color:var(--texto3);text-align:center}

/* CONTROLES */
.campo{display:flex;flex-direction:column;gap:6px;min-width:0}
.campo label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--texto2)}
.campo input,.campo select,.campo textarea,.entrada{background:var(--panel2);border:1px solid var(--linea);border-radius:8px;padding:9px 12px;width:100%}
.campo textarea,textarea.entrada{min-height:80px;resize:vertical}
.rejilla-campos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.btn{border:1px solid var(--linea);background:var(--panel2);border-radius:8px;padding:8px 14px;transition:border-color .15s,background .15s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--oro)}
.btn-oro{background:var(--oro);border-color:var(--oro);color:#16130A;font-weight:600}
.btn-oro:hover{background:var(--oro-claro)}
.btn-peq{padding:5px 10px;font-size:12px}
.btn-texto{background:none;border:0;color:var(--texto2);padding:4px 0;font-size:13px}
.btn-texto:hover{color:var(--oro-claro)}
.chip{border:1px solid var(--linea);background:none;border-radius:999px;padding:5px 12px;font-size:12px;color:var(--texto2);white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--oro);color:var(--oro-claro);background:var(--oro-suave)}
.filtros{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.etiq{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--texto2)}

/* ESTRUCTURA */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);height:100%}
.lateral{background:var(--panel);border-right:1px solid var(--linea);padding:24px 14px;display:flex;flex-direction:column;gap:28px}
.lateral img{width:92px;margin-inline:auto}
.menu{display:flex;flex-direction:column;gap:4px}
.menu button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:8px;color:var(--texto2);display:flex;justify-content:space-between;align-items:center}
.menu button:hover{color:var(--texto);background:var(--panel2)}
.menu button[aria-current="true"]{color:var(--oro-claro);background:var(--oro-suave)}
.menu .cuenta{font-size:12px;font-variant-numeric:tabular-nums;color:var(--texto3)}
.pie-lateral{margin-top:auto;font-size:11px;color:var(--texto3);line-height:1.5}
.principal{overflow:auto;padding-block:28px;padding-inline:28px;min-width:0;display:flex;flex-direction:column;gap:20px}
.cabecera{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between}
.cabecera h2{font-size:34px;line-height:1.05}
.cabecera .sub{color:var(--texto2);font-size:13px;margin-top:4px}
.barra-herr{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.barra-herr .izq,.barra-herr .der{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.buscar{background:var(--panel2);border:1px solid var(--linea);border-radius:8px;padding:8px 12px;width:230px;max-width:100%}
.aviso-ejemplo{font-size:12px;color:var(--texto3);border:1px dashed var(--linea);border-radius:8px;padding:7px 12px}
.segmento{display:inline-flex;border:1px solid var(--linea);border-radius:8px;overflow:hidden}
.segmento button{background:none;border:0;padding:7px 12px;font-size:12px;color:var(--texto2)}
.segmento button[aria-pressed="true"]{background:var(--oro-suave);color:var(--oro-claro)}

/* CIFRAS */
.cifras{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.cifra{background:var(--panel);border:1px solid var(--linea);border-radius:var(--r);padding:14px 16px;min-width:0}
.cifra .num{font-family:var(--f-titulo);font-size:32px;font-weight:600;color:var(--oro-claro);font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px}
.cifra .det{font-size:12px;color:var(--texto3)}
.cifra.alerta .num{color:var(--aviso)}
.cifra.bien .num{color:var(--ok)}

/* ÁREAS, AVATARES, PÍLDORAS */
.area{font-size:10px;text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap;display:inline-block}
.area.dir{color:var(--a-dir)} .area.con{color:var(--a-con)} .area.eve{color:var(--a-eve)} .area.dig{color:var(--a-dig)}
.punto{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.punto.dir{background:var(--a-dir)} .punto.con{background:var(--a-con)} .punto.eve{background:var(--a-eve)} .punto.dig{background:var(--a-dig)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--f-titulo);font-weight:700;font-size:15px;color:var(--oro-claro);background:var(--panel3);border:1px solid var(--linea)}
.avatar.g{width:64px;height:64px;font-size:26px;border-color:rgba(201,162,39,.5)}
.pildora{font-size:11px;padding:3px 9px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;border:1px solid}
.p-ok{color:var(--ok);border-color:rgba(95,167,122,.4);background:rgba(95,167,122,.08)}
.p-aviso{color:var(--aviso);border-color:rgba(217,146,59,.4);background:rgba(217,146,59,.08)}
.p-mal{color:var(--mal);border-color:rgba(201,88,78,.4);background:rgba(201,88,78,.08)}
.p-neutro{color:var(--texto2);border-color:var(--linea)}
.prio{font-size:11px;display:inline-flex;align-items:center;gap:4px;color:var(--texto2)}
.prio::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--texto3)}
.prio.alta::before{background:var(--mal)} .prio.media::before{background:var(--aviso)}

/* PANEL */
.dos-col{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.bloque{background:var(--panel);border:1px solid var(--linea);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.bloque h3{font-size:21px}
.bloque-cab{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.fila-barra{display:grid;grid-template-columns:110px minmax(0,1fr) 90px;gap:10px;align-items:center;font-size:13px}
.barra{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.barra span{display:block;height:100%;background:linear-gradient(90deg,var(--oro),var(--oro-claro));border-radius:4px}
.fila-barra .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--texto2)}
.lista{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.lista li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--linea);font-size:13px}
.lista li:last-child{border-bottom:0}
.lista .crece{flex:1;min-width:0}
.lista .crece small{display:block;color:var(--texto3);font-size:12px}
.lista time{color:var(--texto3);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* PIPELINE */
.kanban-scroll{overflow-x:auto;padding-bottom:8px}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;min-height:460px}
.columna{background:var(--panel);border:1px solid var(--linea);border-radius:var(--r);display:flex;flex-direction:column;min-width:0}
.columna.sobre{border-color:var(--oro);background:#17170F}
.col-cab{padding:12px 14px 10px;border-bottom:1px solid var(--linea);display:flex;flex-direction:column;gap:6px}
.col-tit{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.col-tit h3{font-size:19px}
.col-tit .cnt{font-size:12px;color:var(--texto3);font-variant-numeric:tabular-nums}
.col-val{display:flex;justify-content:space-between;font-size:12px;font-variant-numeric:tabular-nums}
.col-val b{color:var(--oro-claro);font-weight:500}
.col-val span{color:var(--texto3)}
.col-cab .barra{height:3px}
.columna.final .col-cab{background:var(--oro-suave)}
.columna.final h3{color:var(--oro-claro)}
.tarjetas{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}
.lead{background:var(--panel2);border:1px solid var(--linea);border-radius:9px;padding:11px 12px;display:flex;flex-direction:column;gap:8px;cursor:grab;text-align:left;width:100%}
.lead:hover{border-color:rgba(201,162,39,.55)}
.lead.arrastrando{opacity:.35}
.lead-sup{display:flex;gap:10px;align-items:center}
.lead-sup .avatar{width:32px;height:32px;font-size:13px}
.lead-nom{flex:1;min-width:0}
.lead-nom b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead-nom small{display:block;color:var(--texto2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prob{font-size:11px;font-variant-numeric:tabular-nums;color:var(--oro-claro);border:1px solid rgba(201,162,39,.35);border-radius:6px;padding:1px 6px}
.lead-serv{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--texto2);min-width:0}
.lead-serv span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead-inf{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:8px;border-top:1px solid var(--linea)}
.lead-inf .valor{font-family:var(--f-titulo);font-size:18px;font-weight:600;color:var(--texto);font-variant-numeric:tabular-nums}
.paso{font-size:11px;padding:3px 8px;border-radius:6px;background:var(--panel3);color:var(--texto2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%}
.paso.vencido{color:var(--mal);background:rgba(201,88,78,.10)}
.paso.hoy{color:var(--aviso);background:rgba(217,146,59,.10)}
.vacia{font-size:12px;color:var(--texto3);text-align:center;padding:18px 6px;border:1px dashed var(--linea);border-radius:8px}
.perdidos{background:var(--panel);border:1px solid var(--linea);border-radius:var(--r);padding:14px 18px;display:flex;flex-direction:column;gap:6px}

/* TABLAS */
.tabla-env{overflow-x:auto;background:var(--panel);border:1px solid var(--linea);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13px}
.tabla-env table{min-width:720px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--texto2);font-weight:500;text-align:left;padding:11px 14px;border-bottom:1px solid var(--linea);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--linea);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.clic{cursor:pointer}
tbody tr.clic:hover td{background:var(--panel2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.num{color:var(--oro-claro)}
.celda-nom{display:flex;gap:10px;align-items:center}
.celda-nom .avatar{width:30px;height:30px;font-size:12px}
.celda-nom small{display:block;color:var(--texto3);font-size:12px}
tfoot td{font-weight:500;color:var(--texto2)}

/* CLIENTES */
.rejilla-clientes{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.cli{background:var(--panel);border:1px solid var(--linea);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;text-align:left;width:100%;transition:border-color .15s}
.cli:hover{border-color:rgba(201,162,39,.55)}
.cli-sup{display:flex;gap:12px;align-items:center}
.cli-sup .avatar{width:44px;height:44px;font-size:17px}
.cli-sup h3{font-size:21px;line-height:1.1}
.cli-sup small{color:var(--texto2);font-size:12px}
.cli-areas{display:flex;flex-wrap:wrap;gap:5px}
.cli-cifras{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-block:12px;border-block:1px solid var(--linea)}
.cli-cifras div{display:flex;flex-direction:column;gap:2px;min-width:0}
.cli-cifras b{font-family:var(--f-titulo);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.cli-cifras span{font-size:11px;color:var(--texto3)}
.cli-pie{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--texto3)}

/* FICHA DE CLIENTE */
.volver{align-self:flex-start}
.ficha-cab{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;background:linear-gradient(120deg,#1A1810,var(--panel) 55%);border:1px solid rgba(201,162,39,.3);border-radius:14px;padding:22px}
.ficha-id{display:flex;gap:16px;align-items:center;min-width:0}
.ficha-id h2{font-size:38px;line-height:1}
.ficha-id p{color:var(--texto2);font-size:13px;margin-top:6px}
.ficha-id .cli-areas{margin-top:8px}
.acciones{display:flex;flex-wrap:wrap;gap:8px}
.pestanas{display:flex;gap:4px;border-bottom:1px solid var(--linea);overflow-x:auto}
.pestanas button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--texto2);white-space:nowrap}
.pestanas button[aria-selected="true"]{color:var(--oro-claro);border-bottom-color:var(--oro)}
.tareas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.tareas li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--linea);font-size:13px}
.tareas li:last-child{border-bottom:0}
.tareas input[type=checkbox]{accent-color:var(--oro);width:16px;height:16px}
.tareas .hecha span{text-decoration:line-through;color:var(--texto3)}
.tareas time{margin-left:auto;font-size:12px;color:var(--texto3);white-space:nowrap}
.tareas time.vencido{color:var(--mal)}
.fila-anadir{display:flex;gap:8px}
.fila-anadir .entrada{flex:1}
.nota{background:var(--panel2);border:1px solid var(--linea);border-radius:8px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.nota.fijada{border-color:rgba(201,162,39,.45);background:#1B1A12}
.nota small{color:var(--texto3);font-size:11px}
.contacto{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--linea)}
.contacto:last-child{border-bottom:0}
.contacto div{flex:1;min-width:0;font-size:13px}
.contacto small{display:block;color:var(--texto3);font-size:12px;word-break:break-word}
.datos{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 12px;font-size:13px;margin:0}
.datos dt{color:var(--texto2)}
.datos dd{margin:0;word-break:break-word}

/* HISTORIAL */
.historial{list-style:none;margin:0;padding:0 0 0 16px;display:flex;flex-direction:column;gap:14px;border-left:1px solid var(--linea)}
.historial li{position:relative;font-size:13px}
.historial li::before{content:"";position:absolute;left:-20px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--oro)}
.historial .cuando{font-size:11px;color:var(--texto3);font-variant-numeric:tabular-nums}
.historial .que{color:var(--oro-claro);font-weight:500}

/* PANEL LATERAL DE LEAD */
.velo{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30}
.cajon{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--panel);border-left:1px solid var(--linea);z-index:31;overflow:auto;
  padding:calc(20px + env(safe-area-inset-top,0px)) 22px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.cajon-sup{display:flex;justify-content:space-between;align-items:center}
.cerrar{background:none;border:0;color:var(--texto2);font-size:24px;line-height:1;padding:4px 8px}
.cajon-id{display:flex;gap:14px;align-items:center}
.cajon-id h2{font-size:30px;line-height:1.05}
.cajon-id p{color:var(--texto2);font-size:13px}
.prob-bloque{background:var(--panel2);border:1px solid var(--linea);border-radius:10px;padding:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.prob-bloque div{display:flex;flex-direction:column;gap:2px}
.prob-bloque b{font-family:var(--f-titulo);font-size:22px;font-weight:600;color:var(--oro-claro);font-variant-numeric:tabular-nums}
.prob-bloque span{font-size:11px;color:var(--texto3)}
.prob-bloque .barra{grid-column:1/-1;height:5px}
.paso-caja{border:1px solid rgba(201,162,39,.35);background:#17160F;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.paso-actual{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13px}
.paso-form{display:grid;grid-template-columns:minmax(0,1fr) 140px auto;gap:8px}

/* MODAL Y AVISOS */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.65);overflow:auto}
.modal-caja{background:var(--panel);border:1px solid rgba(201,162,39,.4);border-radius:14px;padding:24px;width:100%;max-width:520px;display:flex;flex-direction:column;gap:14px}
.modal-caja h3{font-size:26px}
.modal-caja p{color:var(--texto2);font-size:13px}
.modal-acciones{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.error{color:var(--mal);font-size:12px}
.aviso-flotante{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--oro);border-radius:999px;padding:10px 18px;z-index:60;font-size:13px;white-space:nowrap}

/* MÓVIL */
.barra-movil{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .lateral{display:none}
  .barra-movil{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--linea);background:var(--panel);overflow-x:auto}
  .barra-movil img{width:32px}
  .barra-movil button{background:none;border:0;color:var(--texto2);padding:8px 10px;border-radius:8px;white-space:nowrap}
  .barra-movil button[aria-current="true"]{color:var(--oro-claro);background:var(--oro-suave)}
  .principal{padding-inline:16px;padding-block:18px}
  .cifras{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dos-col{grid-template-columns:minmax(0,1fr)}
  .cabecera h2{font-size:28px}
  .ficha-id h2{font-size:30px}
  .rejilla-campos,.paso-form{grid-template-columns:minmax(0,1fr)}
  .fila-barra{grid-template-columns:90px minmax(0,1fr) 70px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Añadidos v4 */
.lead{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.lead.arrastrando{opacity:.3}
.fantasma{position:fixed;z-index:70;pointer-events:none;margin:0;transform:rotate(2deg) scale(1.02);box-shadow:0 14px 30px rgba(0,0,0,.55);border-color:var(--oro)!important;opacity:.95}
body.arrastrando-lead{cursor:grabbing;user-select:none;-webkit-user-select:none}
.columna.sobre .col-cab{background:var(--oro-suave)}

.aviso-datos{font-size:12px;color:var(--texto2);border:1px solid rgba(201,162,39,.3);background:var(--oro-suave);border-radius:8px;padding:8px 12px}
tr.actual td{background:var(--oro-suave)}
tr.actual td:first-child{box-shadow:inset 2px 0 0 var(--oro)}
.porconf{color:var(--texto3);font-style:italic}
.sel-mini{background:var(--panel2);border:1px solid var(--linea);border-radius:6px;padding:4px 8px;font-size:12px}
.prods{display:flex;flex-wrap:wrap;gap:5px}
.prod-chip{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--panel3);color:var(--texto2);white-space:nowrap}
.prod-chip.off{opacity:.55;text-decoration:line-through}
[hidden]{display:none!important}
.lead-cta{font-size:11px;color:var(--texto3)}
.lead-cta b{color:var(--oro-claro);font-weight:500}
.dinero .fila-barra{grid-template-columns:150px minmax(0,1fr) 100px}
.fila-barra .marca{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;display:flex}
.fila-barra .marca i{display:block;height:100%}
.fila-barra .marca i.cob{background:var(--ok)}
.fila-barra .marca i.pot{background:linear-gradient(90deg,var(--oro),var(--oro-claro))}
.leyenda{display:flex;gap:14px;font-size:11px;color:var(--texto3)}
.leyenda span{display:inline-flex;align-items:center;gap:5px}
.leyenda i{width:10px;height:6px;border-radius:2px;display:inline-block}
@media (max-width:900px){.dinero .fila-barra{grid-template-columns:100px minmax(0,1fr) 80px}}
/* Diseño que crece con el contenido (sin alturas fijas de pantalla) */
html,body{height:auto}
#acceso{position:relative;inset:auto;min-height:640px}
.app{height:auto;align-items:start;background:linear-gradient(90deg,var(--panel) 0 219px,var(--linea) 219px 220px,transparent 220px)}
.lateral{position:sticky;top:0;align-self:start;border-right:0;background:none}
.principal{overflow:visible}
.ayuda-movil{display:none;font-size:12px;color:var(--texto3)}
@media (max-width:900px){
  .app{background:none}
  .barra-movil{position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
  .ayuda-movil{display:block}
  .cajon{width:100%}
}

.lead-cta{font-size:11px;color:var(--texto3)}
#p-proys .chip input{accent-color:var(--oro)}
.ir-agenda{color:var(--oro-claro)!important;font-weight:700}
.fila-liq{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--linea);font-size:13px}
.fila-liq b{font-weight:600;text-align:right}.fila-liq b small{display:block;font-weight:400;font-size:11px;color:var(--texto3)}

.fila-liq.total{border-bottom:0;font-size:14px}.fila-liq.total b{color:var(--oro-claro);font-size:16px}
.columna.cerrada{opacity:.78}
td.num{white-space:nowrap}

const hoy = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };

const difDias = (s) => { const f = aFecha(s); if (!f) return null; f.setHours(0,0,0,0); return Math.round((f - hoy()) / 864e5); };
const fF = (s) => { const f = aFecha(s); return f ? f.toLocaleDateString("es-ES", {day: "numeric", month: "short"}) : "—"; };
const fHora = (s) => new Date(s).toLocaleString("es-ES", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"});
const rel = (s) => { const n = difDias(s); if (n === null) return "sin fecha"; if (n === 0) return "hoy"; if (n === 1) return "mañana"; if (n === -1) return "ayer"; if (n < 0) return "hace " + (-n) + " d"; if (n < 7) return "en " + n + " d"; return fF(s); };
const estadoPaso = (s) => { const n = difDias(s); return n === null ? "" : n < 0 ? "vencido" : n === 0 ? "hoy" : ""; };
const iniciales = (s) => String(s || "?").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "?";
const esDir = () => yo && yo.rol === "director";
const esSocio = (proy) => !!yo && miembros.some(m => m.perfil_id === yo.id && m.socio && (!proy || m.proyecto_id === proy));
const veVentas = () => esDir() || esSocio();
const normNom = (n) => String(n || "").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const esYo = (n) => { const a = normNom(n), b = normNom(yo && yo.nombre); return !!a && (a === b || b.startsWith(a + " ") || a.startsWith(b + " ")); };
const cuentaDe = (id) => (proyectos.find(p => p.id === id) || {}).cuenta || "Sin cuenta";
const proyDeVenta = (v) => { const n = String(v.proyecto || "").trim().toLowerCase(); const p = proyectos.find(x => x.id === n || x.nombre.toLowerCase() === n); return p ? p.id : null; };
/* Comisiones: lo que cobra Javier como closer o setter es ingreso de CDV by JCerezo */
const esJavier = (n) => /^javier(\s+cerezo)?$/i.test(String(n || "").trim());
function repartoVenta(v) {
  const r = [];
  if (v.closer) r.push({nombre: v.closer, papel: "closer", com: +v.com_closer || 0});
  if (v.closer2) r.push({nombre: v.closer2, papel: "closer", com: +v.com_closer2 || 0});
  if (v.setter) r.push({nombre: v.setter, papel: "setter", com: +v.com_setter || 0});
  return r;
}
const comJavier = (v) => repartoVenta(v).filter(p => esJavier(p.nombre)).reduce((s, p) => s + p.com, 0);
const ingresoCDV = (v) => (+v.com_cdv || 0) + comJavier(v);
const comEquipo = (v) => repartoVenta(v).filter(p => !esJavier(p.nombre)).reduce((s, p) => s + p.com, 0);
const aLiquidar = (v) => v.liquidado_cdv != null ? +v.liquidado_cdv : ingresoCDV(v);
const r2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
function pasaFiltro(proyecto_id, f) { if (f === "todos") return true; if (f.startsWith("cuenta:")) return cuentaDe(proyecto_id) === f.slice(7); return proyecto_id === f; }
function chipsProyecto(attr, f) {
  const vis = proyectos.filter(p => misProyectos.includes(p.id));
  const cuentas = [...new Set(vis.map(p => p.cuenta || "Sin cuenta"))];
  const cuentaSel = f.startsWith("cuenta:") ? f.slice(7) : f !== "todos" ? cuentaDe(f) : null;
  const fila1 = `<button class="chip" data-${attr}="todos" aria-pressed="${f === "todos"}">Todos</button>` + cuentas.map(c => {
    const prods = vis.filter(p => (p.cuenta || "Sin cuenta") === c);
    const val = prods.length > 1 ? "cuenta:" + c : prods[0].id;
    return `<button class="chip" data-${attr}="${esc(val)}" aria-pressed="${cuentaSel === c}">${esc(prods.length > 1 ? c : prods[0].nombre)}${prods.length > 1 ? " ▾" : ""}</button>`;
  }).join("");
  const prodsSel = cuentaSel ? vis.filter(p => (p.cuenta || "Sin cuenta") === cuentaSel) : [];
  const fila2 = prodsSel.length > 1 ? `<div class="filtros" style="margin-top:6px;padding-left:10px;border-left:2px solid var(--oro)"><button class="chip" data-${attr}="cuenta:${esc(cuentaSel)}" aria-pressed="${f === "cuenta:" + cuentaSel}">Todo ${esc(cuentaSel)}</button>${prodsSel.map(p => `<button class="chip" data-${attr}="${p.id}" aria-pressed="${f === p.id}">${esc(p.nombre)}</button>`).join("")}</div>` : "";
  return `<div><div class="filtros" role="group" aria-label="Proyecto">${fila1}</div>${fila2}</div>`;
}
const etiquetaProy = (id) => { const c = cuentaDe(id), n = nomProy(id); return c && c !== n && c !== "Sin cuenta" ? `${esc(c)} · ${esc(n)}` : esc(n); };
const nomProy = (id) => (proyectos.find(p => p.id === id) || {}).nombre || "Sin proyecto";
const nomPersona = (id) => (equipo.find(p => p.id === id) || perfiles.find(p => p.id === id) || {}).nombre || "—";
const fechaISO = (d) => { const x = new Date(d); return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); };

function aviso(t, error) {
  const el = document.createElement("div");
  el.className = "aviso-flotante"; el.setAttribute("role", "status"); el.textContent = t;
  if (error) el.style.borderColor = "var(--mal)";
  document.body.appendChild(el); setTimeout(() => el.remove(), error ? 5000 : 2400);
}
function fallo(err, contexto) {
  console.error(contexto, err);
  const m = (err && (err.message || err.error_description)) || String(err);
  aviso((contexto ? contexto + ": " : "") + m, true);
}

/* ===== ACCESO ===== */
function pantallaAcceso(modo = "entrar", mensaje = "") {
  $("#app").hidden = true; $("#acceso").hidden = false;
  const f = $("#form-acceso");
  const titulos = {entrar: "Área de gestión", registro: "Crear cuenta", recuperar: "Recuperar contraseña", nueva: "Nueva contraseña"};
  f.innerHTML = `<img src="${LOGO}" alt="CDV by JCerezo"><h1>${titulos[modo]}</h1>
    ${mensaje ? `<p class="nota-ejemplo" style="color:var(--texto)">${mensaje}</p>` : ""}
    ${modo === "registro" ? `<div class="campo"><label for="acc-nombre">Nombre y apellido</label><input id="acc-nombre" required autocomplete="name"></div>` : ""}
    ${modo !== "nueva" ? `<div class="campo"><label for="acc-email">Correo</label><input id="acc-email" type="email" required autocomplete="username"></div>` : ""}
    ${modo !== "recuperar" ? `<div class="campo"><label for="acc-pass">Contraseña${modo !== "entrar" ? " (mínimo 8 caracteres)" : ""}</label><input id="acc-pass" type="password" required minlength="${modo === "entrar" ? 1 : 8}" autocomplete="${modo === "entrar" ? "current-password" : "new-password"}"></div>` : ""}
    <div class="error" id="acc-err" hidden></div>
    <button class="btn btn-oro" type="submit" style="justify-content:center">${{entrar: "Entrar", registro: "Crear cuenta", recuperar: "Enviar enlace", nueva: "Guardar contraseña"}[modo]}</button>
    <p class="nota-ejemplo">${modo === "entrar"
      ? `<a href="#" data-modo="registro" style="color:var(--oro-claro)">Crear cuenta</a> · <a href="#" data-modo="recuperar" style="color:var(--oro-claro)">He olvidado mi contraseña</a>`
      : `<a href="#" data-modo="entrar" style="color:var(--oro-claro)">Volver a entrar</a>`}</p>`;
  f.querySelectorAll("[data-modo]").forEach(a => a.onclick = (e) => { e.preventDefault(); pantallaAcceso(a.dataset.modo); });
  const err = (t) => { $("#acc-err").textContent = t; $("#acc-err").hidden = false; };
  f.onsubmit = async (e) => {
    e.preventDefault();
    const btn = f.querySelector("button[type=submit]"); btn.disabled = true;
    try {
      const email = $("#acc-email") ? $("#acc-email").value.trim() : null;
      const pass = $("#acc-pass") ? $("#acc-pass").value : null;
      if (modo === "entrar") {
        const {error} = await sb.auth.signInWithPassword({email, password: pass});
        if (error) return err(error.message === "Invalid login credentials" ? "Correo o contraseña incorrectos." : error.message === "Email not confirmed" ? "Confirma tu correo: revisa tu bandeja de entrada." : error.message);
        await arrancar();
      } else if (modo === "registro") {
        const nombre = $("#acc-nombre").value.trim();
        const {data, error} = await sb.auth.signUp({email, password: pass, options: {data: {nombre}, emailRedirectTo: location.origin + location.pathname}});
        if (error) return err(error.message);
        if (data.session) await arrancar();
        else pantallaAcceso("entrar", "Cuenta creada. Te hemos enviado un correo para confirmarla. Después podrás entrar.");
      } else if (modo === "recuperar") {
        const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: location.origin + location.pathname});
        if (error) return err(error.message);
        pantallaAcceso("entrar", "Si el correo existe, te hemos enviado un enlace para cambiar la contraseña.");
      } else if (modo === "nueva") {
        const {error} = await sb.auth.updateUser({password: pass});
        if (error) return err(error.message);
        aviso("Contraseña actualizada"); await arrancar();
      }
    } finally { btn.disabled = false; }
  };
  const p = f.querySelector("input"); if (p) p.focus();
}

async function salir() { await sb.auth.signOut(); yo = null; leads = []; pantallaAcceso("entrar"); }

/* ===== CARGA DE DATOS ===== */
async function arrancar() {
  const {data: {user}} = await sb.auth.getUser();
  if (!user) return pantallaAcceso("entrar");
  const {data: perfil, error} = await sb.from("crm_perfiles").select("*").eq("id", user.id).maybeSingle();
  if (error) return fallo(error, "No se pudo cargar tu perfil");
  if (!perfil) return pantallaAcceso("entrar", "Tu cuenta existe pero no tiene perfil en el CRM. Avisa a Javier.");
  if (!perfil.activo) { await sb.auth.signOut(); return pantallaAcceso("entrar", `Hola ${esc(perfil.nombre)}: tu cuenta está pendiente de activación. Javier te dará acceso y te asignará tus proyectos.`); }
  yo = perfil;
  $("#acceso").hidden = true; $("#app").hidden = false;
  $("#pie-usuario").innerHTML = `${esc(yo.nombre)} · ${{director: "Director", closer: "Closer", setter: "Setter"}[yo.rol]}<br><a href="#" id="salir" style="color:var(--oro-claro)">Cerrar sesión</a>`;
  $("#salir").onclick = (e) => { e.preventDefault(); salir(); };
  document.querySelectorAll("[data-solo-director]").forEach(b => b.hidden = !esDir());
  await cargarTodo();
  document.querySelectorAll('[data-vista="ventas"][data-solo-director]').forEach(b => b.hidden = !veVentas());
  render();
}

async function cargarTodo() {
  const pet = [
    sb.from("crm_proyectos").select("*").order("nombre"),
    sb.from("crm_miembros").select("*"),
    sb.rpc("crm_equipo"),
    sb.from("crm_leads").select("*").order("actualizado", {ascending: false}),
    sb.from("crm_reuniones").select("*").gte("inicio", new Date(Date.now() - 90 * 864e5).toISOString()).order("inicio"),
  ];
  if (esDir()) pet.push(sb.from("crm_perfiles").select("*").order("creado"), sb.from("ventas").select("*").order("id"));
  const pFact = esDir() ? sb.from("facturas").select("*").order("fecha") : null;
  const r = await Promise.all(pet);
  const e = r.find(x => x.error); if (e) return fallo(e.error, "Error al cargar datos");
  proyectos = r[0].data; miembros = r[1].data; equipo = r[2].data; leads = r[3].data; reuniones = r[4].data;
  if (!esDir() && esSocio()) { const v = await sb.from("ventas").select("*").order("id"); ventas = v.error ? [] : v.data || []; }
  if (esDir()) {
    perfiles = r[5].data; ventas = r[6].data || [];
    const f = await pFact; facturas = f.error ? [] : f.data || [];
    if (f.error) console.warn("Facturas no disponibles:", f.error.message);
  }
  misProyectos = esDir() ? proyectos.map(p => p.id) : miembros.filter(m => m.perfil_id === yo.id).map(m => m.proyecto_id);
}

async function recargarLeads() {
  const {data, error} = await sb.from("crm_leads").select("*").order("actualizado", {ascending: false});
  if (error) return fallo(error, "Error al cargar leads");
  leads = data;
}

/* ===== RENDER GENERAL ===== */
function render() {
  const activos = leads.filter(l => esActivo(l));
  $("#c-leads").textContent = activos.length;
  const pend = perfiles.filter(p => !p.activo).length;
  $("#c-equipo").textContent = pend ? pend + " pend." : "";
  document.querySelectorAll("[data-vista]").forEach(b => b.setAttribute("aria-current", b.dataset.vista === vista));
  const m = $("#principal");
  if (vista === "panel") m.innerHTML = vPanel();
  if (vista === "pipeline") m.innerHTML = vPipeline();
  if (vista === "equipo" && esDir()) m.innerHTML = vEquipo();
  if (vista === "proyectos") m.innerHTML = vProyectos();
  if (vista === "contactos") m.innerHTML = vContactos();
  if (vista === "ventas" && veVentas()) m.innerHTML = vVentas();
  if (vista === "calendario") m.innerHTML = vCalendario();
  enlazar(m);
}

function enlazar(r) {
  r.querySelectorAll("[data-vista]").forEach(b => b.onclick = () => { vista = b.dataset.vista; render(); });
  r.querySelectorAll("[data-lead]").forEach(b => { b.onclick = () => abrirLead(+b.dataset.lead); b.onkeydown = (e) => { if (e.key === "Enter") abrirLead(+b.dataset.lead); }; });
  r.querySelectorAll("[data-fproy]").forEach(b => b.onclick = () => { filtroProy = b.dataset.fproy; render(); });
  r.querySelectorAll("[data-nuevo-lead]").forEach(b => b.onclick = nuevoLead);
  const fp = $("#f-persona", r); if (fp) fp.onchange = () => { filtroPersona = fp.value; render(); };
  const bq = $("#buscar", r); if (bq) bq.oninput = () => { busqueda = bq.value; const pos = bq.selectionStart; render(); const n = $("#buscar"); n.focus(); n.setSelectionRange(pos, pos); };
  const vp = $("#ver-perdidos", r); if (vp) vp.onclick = () => { verPerdidos = !verPerdidos; render(); };
  r.querySelectorAll("[data-perfil]").forEach(b => b.onclick = () => editarPerfil(b.dataset.perfil));
  r.querySelectorAll("[data-factura]").forEach(b => b.onclick = () => editarFactura(+b.dataset.factura));
  const nf = $("#nueva-factura", r); if (nf) nf.onclick = () => editarFactura(null);
  r.querySelectorAll("[data-fventa]").forEach(b => b.onclick = () => { filtroVentas = b.dataset.fventa; render(); });
  r.querySelectorAll("[data-fcont]").forEach(b => b.onclick = () => { filtroContProy = b.dataset.fcont; render(); });
  const bc = $("#buscar-cont", r); if (bc) bc.oninput = () => { busqContactos = bc.value; const pos = bc.selectionStart; render(); const n = $("#buscar-cont"); n.focus(); n.setSelectionRange(pos, pos); };
  const ex = $("#exportar-cont", r); if (ex) ex.onclick = exportarContactos;
  r.querySelectorAll("[data-semana]").forEach(b => b.onclick = () => { semana = b.dataset.semana === "0" ? 0 : semana + (+b.dataset.semana); render(); });
  r.querySelectorAll("[data-nueva-reunion]").forEach(b => b.onclick = () => editarReunion(null, {fecha: b.dataset.fecha || null}));
  r.querySelectorAll("[data-reunion]").forEach(b => b.onclick = (e) => { e.stopPropagation(); editarReunion(+b.dataset.reunion); });
}

/* ===== PANEL ===== */
function vPanel() {
  const act = leads.filter(l => esActivo(l));
  const ganados = leads.filter(l => l.etapa === GANADO);
  const pipeline = act.reduce((s, l) => s + (+l.valor || 0), 0);
  const pond = act.reduce((s, l) => s + (+l.valor || 0) * (PROB[l.etapa] || 0) / 100, 0);
  const venc = act.filter(l => difDias(l.proximo_paso_fecha) !== null && difDias(l.proximo_paso_fecha) < 0);
  const sinPaso = act.filter(l => !l.proximo_paso_fecha);
  const pasos = act.filter(l => l.proximo_paso_fecha).sort((a, b) => a.proximo_paso_fecha.localeCompare(b.proximo_paso_fecha)).slice(0, 8);
  const h = new Date().getHours();
  const saludo = h < 14 ? "Buenos días" : h < 21 ? "Buenas tardes" : "Buenas noches";
  const porProy = proyectos.filter(p => misProyectos.includes(p.id)).map(p => ({p, n: act.filter(l => l.proyecto_id === p.id).length, v: act.filter(l => l.proyecto_id === p.id).reduce((s, l) => s + (+l.valor || 0), 0)})).filter(x => x.n);
  const max = Math.max(1, ...porProy.map(x => x.v));
  return `<div class="cabecera"><div><h2>${saludo}, ${esc(yo.nombre.split(" ")[0])}</h2><div class="sub">${new Date().toLocaleDateString("es-ES", {weekday: "long", day: "numeric", month: "long"})} · ${esDir() ? "visión de todo el equipo" : "tus leads"}</div></div>
    <button class="btn btn-oro" data-nuevo-lead>+ Nuevo lead</button></div>
  <section class="cifras">
    <div class="cifra"><div class="etiq">Leads activos</div><div class="num">${act.length}</div><div class="det">${eur(pipeline)} en pipeline</div></div>
    <div class="cifra"><div class="etiq">Valor ponderado</div><div class="num">${eur(pond)}</div><div class="det">según la probabilidad de cada etapa</div></div>
    <div class="cifra ${venc.length ? "alerta" : "bien"}"><div class="etiq">Pasos vencidos</div><div class="num">${venc.length}</div><div class="det">${venc.length ? "leads sin actualizar" : "todo al día"}${sinPaso.length ? ` · ${sinPaso.length} sin próximo paso` : ""}</div></div>
    ${esDir() ? `<div class="cifra bien" data-vista="ventas" style="cursor:pointer"><div class="etiq">Ventas cerradas</div><div class="num">${ventas.length}</div><div class="det">${eur(ventas.reduce((s, v) => s + (+v.importe || 0), 0))} · ver ventas →</div></div>` : `<div class="cifra bien"><div class="etiq">Ganados</div><div class="num">${ganados.length}</div><div class="det">${eur(ganados.reduce((s, l) => s + (+l.valor || 0), 0))}</div></div>`}
  </section>
  ${bloqueReunionesHoy()}
  <section class="dos-col">
    <div class="bloque"><div class="bloque-cab"><h3>Próximos pasos</h3><button class="btn-texto" data-vista="pipeline">Abrir pipeline →</button></div>
      ${pasos.length ? `<ul class="lista">${pasos.map(l => `<li class="clic" data-lead="${l.id}" style="cursor:pointer"><span class="crece"><b style="font-weight:500">${esc(l.proximo_paso || "Seguimiento")}</b> · ${esc(l.empresa)}<small>${esc(nomProy(l.proyecto_id))}${esDir() ? " · " + esc(nomPersona(l.closer_id)) : ""}</small></span><span class="paso ${estadoPaso(l.proximo_paso_fecha)}">${rel(l.proximo_paso_fecha)}</span></li>`).join("")}</ul>` : `<p class="vacia">No hay próximos pasos programados.</p>`}
    </div>
    <div class="bloque"><div class="bloque-cab"><h3>Pipeline por proyecto</h3></div>
      ${porProy.length ? porProy.map(x => `<div class="fila-barra"><span>${esc(x.p.nombre)}</span><div class="barra"><span style="width:${x.v / max * 100}%"></span></div><span class="n">${x.n} · ${eur(x.v)}</span></div>`).join("") : `<p class="vacia">Aún no hay leads. Crea el primero con «Nuevo lead».</p>`}
    </div>
  </section>`;
}

/* ===== PIPELINE ===== */
function filtrados() {
  const q = busqueda.toLowerCase();
  return leads.filter(l => pasaFiltro(l.proyecto_id, filtroProy))
    .filter(l => filtroPersona === "todos" || (filtroPersona === "sin" ? !l.closer_id && !l.setter_id : l.closer_id === filtroPersona || l.setter_id === filtroPersona))
    .filter(l => !q || [l.empresa, l.contacto, l.email, l.telefono].join(" ").toLowerCase().includes(q));
}
function tarjeta(l) {
  return `<div class="lead" role="button" tabindex="0" data-lead="${l.id}">
    <span class="lead-sup"><span class="avatar">${iniciales(l.empresa)}</span><span class="lead-nom"><b>${esc(l.empresa)}</b><small>${esc(l.contacto || "Sin contacto")}</small></span><span class="prob">${PROB[l.etapa] || 0} %</span></span>
    <span class="lead-serv"><span class="punto dir"></span><span>${etiquetaProy(l.proyecto_id)}</span></span>
    <span class="lead-inf"><span class="valor">${+l.valor ? eur(l.valor) : "—"}</span><span class="paso ${estadoPaso(l.proximo_paso_fecha)}">${esc(l.proximo_paso || "Sin próximo paso")}${l.proximo_paso_fecha ? " · " + rel(l.proximo_paso_fecha) : ""}</span></span>
    <span class="lead-cta">Closer: <b>${esc(l.closer_id ? nomPersona(l.closer_id) : "sin asignar")}</b>${l.setter_id ? " · Setter: " + esc(nomPersona(l.setter_id)) : ""}</span>
  </div>`;
}
function ventasGanadas() {
  if (!veVentas()) return [];
  const q = busqueda.toLowerCase();
  const nomFiltro = filtroPersona !== "todos" && filtroPersona !== "sin" ? nomPersona(filtroPersona).toLowerCase() : null;
  const yaLead = new Set(leads.filter(l => l.etapa === GANADO).map(l => normEmp(l.empresa) + "|" + l.proyecto_id));
  return ventas.filter(v => pasaFiltro(proyDeVenta(v), filtroProy))
    .filter(v => filtroPersona === "todos" || (nomFiltro && repartoVenta(v).some(p => p.nombre.toLowerCase() === nomFiltro)))
    .filter(v => !q || String(v.cliente || "").toLowerCase().includes(q))
    .filter(v => !yaLead.has(normEmp(v.cliente) + "|" + proyDeVenta(v)));
}
function tarjetaVenta(v) {
  const id = proyDeVenta(v), e = ESTADO_VENTA[v.estado] || [v.estado, "p-neutro"];
  const closers = [v.closer, v.closer2].filter(Boolean).join(" + ");
  return `<div class="lead" role="button" tabindex="0" data-vista="ventas" title="Ver en Ventas" style="border-left:3px solid var(--bien)">
    <span class="lead-sup"><span class="avatar">${iniciales(v.cliente)}</span><span class="lead-nom"><b>${esc(v.cliente)}</b><small>Venta cerrada${v.tipo_cobro === "mensual" ? " · cuota mensual" : ""}</small></span><span class="prob">✓</span></span>

function vPipeline() {

    <form id="f-nota"><div class="campo"><label for="nota-txt">Añadir nota</label><textarea id="nota-txt" placeholder="Qué ha pasado"></textarea></div><button class="btn" type="submit">Guardar nota</button></form>
    <div class="rejilla-campos">

  $("#reunion-lead").onclick = () => editarReunion(null, {lead_id: l.id});
  const nota = async (tipo, texto) => {
    const {error} = await sb.from("crm_actividad").insert({lead_id: l.id, autor_id: yo.id, tipo, texto});
    if (error) throw error;
  };
  const actualizar = async (cambios) => {
    const {data, error} = await sb.from("crm_leads").update(cambios).eq("id", l.id).select().single();
    if (error) throw error;
    Object.assign(l, data);
  };

    try { await nota("llamada", b.dataset.llamada); await actualizar({actualizado: new Date().toISOString()}); aviso("Llamada registrada"); abrirLead(l.id); render(); } catch (e) { fallo(e, "No se pudo guardar"); }
  });
  $("#f-nota").onsubmit = async (e) => {
    e.preventDefault(); const t = $("#nota-txt").value.trim(); if (!t) return;
    try { await nota("nota", t); await actualizar({actualizado: new Date().toISOString()}); aviso("Nota guardada"); abrirLead(l.id); render(); } catch (err) { fallo(err, "No se pudo guardar la nota"); }
  };
  $("#f-paso").onsubmit = async (e) => {
    e.preventDefault(); const a = $("#paso-accion").value.trim(), f = $("#paso-fecha").value;

    try { await actualizar({proximo_paso: a, proximo_paso_fecha: f}); await nota("paso", a + " · " + fF(f)); aviso("Próximo paso programado"); abrirLead(l.id); render(); } catch (err) { fallo(err, "No se pudo programar"); }
  };

      valor: $("#l-valor").value ? Math.round(parseFloat($("#l-valor").value) * 100) / 100 : 0,

      telefono: $("#l-tel").value.trim() || null, email: $("#l-email").value.trim() || null,
    };
    const nuevaEtapa = $("#l-etapa").value;
    let motivo = null;
    if (nuevaEtapa !== l.etapa) {
      if (nuevaEtapa === PERDIDO) { motivo = prompt("Motivo de la pérdida (" + MOTIVOS.join(", ") + "):", "No responde"); if (motivo === null) return; cambios.motivo_perdida = motivo; }
      if (nuevaEtapa === NO_INTERESA) { motivo = prompt("Motivo (" + MOTIVOS_NO.join(", ") + "):", "No le interesa"); if (motivo === null) return; cambios.motivo_perdida = motivo; }
      cambios.etapa = nuevaEtapa;
    }
    const reasigna = [];
    if (esDir()) {

const cerrarCapa = () => $("#capa").innerHTML = "";

/* ===== MODAL ===== */
function modal(html, alEnviar, txtOk) {
  const capa = $("#capa");
  capa.innerHTML = `<div class="modal"><form class="modal-caja" id="f-modal">${html}<div class="error" id="err" hidden></div><div class="modal-acciones"><button type="button" class="btn" data-cerrar>Cancelar</button><button class="btn btn-oro" type="submit">${txtOk || "Guardar"}</button></div></form></div>`;
  capa.querySelector("[data-cerrar]").onclick = cerrarCapa;
  $("#f-modal").onsubmit = async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector("button[type=submit]"); btn.disabled = true;
    try {
      const r = await alEnviar();
      if (typeof r === "string") { $("#err").textContent = r; $("#err").hidden = false; }
      else { cerrarCapa(); render(); }
    } finally { btn.disabled = false; }
  };
  const p = capa.querySelector("input,select,textarea"); if (p) p.focus();
}

function editarPerfil(id) {
  const p = perfiles.find(x => x.id === id); if (!p) return;
  const suyos = miembros.filter(m => m.perfil_id === id).map(m => m.proyecto_id);
  const esYo = p.id === yo.id;
  modal(`<h3>${esc(p.nombre)}</h3><p>${esc(p.email || "")}</p>

      <div class="campo"><label for="p-activo">Acceso</label><select id="p-activo" ${esYo ? "disabled" : ""}><option value="1" ${p.activo ? "selected" : ""}>Activo</option><option value="0" ${!p.activo ? "selected" : ""}>Sin acceso</option></select></div>
    </div>
    <div><div class="etiq" style="margin-bottom:4px">Proyectos en los que trabaja</div><p class="nota-ejemplo" style="margin:0 0 8px">Marca <b>Socio</b> para que vea todos los leads, reuniones y ventas de ese proyecto, no solo los suyos.</p>
      <div id="p-proys" style="display:grid;gap:6px">${[...proyectos].sort((a, b) => (a.cuenta || "").localeCompare(b.cuenta || "", "es") || a.nombre.localeCompare(b.nombre, "es")).map(pr => { const mm = miembros.find(m => m.perfil_id === id && m.proyecto_id === pr.id); return `<div style="display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center"><label style="cursor:pointer;display:inline-flex;gap:6px;align-items:center"><input type="checkbox" data-proy value="${pr.id}" ${mm ? "checked" : ""} style="width:auto;margin:0"> ${etiquetaProy(pr.id)}</label><label style="cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--texto2);font-size:13px"><input type="checkbox" data-socio="${pr.id}" ${mm && mm.socio ? "checked" : ""} style="width:auto;margin:0"> Socio</label></div>`; }).join("")}</div></div>`, async () => {

    if (!esYo) { cambios.rol = $("#p-rol").value; cambios.activo = $("#p-activo").value === "1"; }

    const socioDe = (x) => !!document.querySelector(`#p-proys [data-socio="${x}"]:checked`);
    document.querySelectorAll("#p-proys [data-socio]:checked").forEach(c => { const pc = document.querySelector(`#p-proys [data-proy][value="${c.dataset.socio}"]`); if (pc) pc.checked = true; });
    const elegidos = [...document.querySelectorAll("#p-proys [data-proy]:checked")].map(i => i.value);
    const quitar = suyos.filter(x => !elegidos.includes(x)), poner = elegidos.filter(x => !suyos.includes(x));
    const cambiarSocio = elegidos.filter(x => suyos.includes(x) && !!(miembros.find(m => m.perfil_id === id && m.proyecto_id === x) || {}).socio !== socioDe(x));
    if (quitar.length) { const {error: e1} = await sb.from("crm_miembros").delete().eq("perfil_id", id).in("proyecto_id", quitar); if (e1) return "Error al quitar proyectos: " + e1.message; }
    let sinSocio = false;
    if (poner.length) {
      let {error: e2} = await sb.from("crm_miembros").insert(poner.map(x => ({perfil_id: id, proyecto_id: x, socio: socioDe(x)})));
      if (e2 && /socio/i.test(e2.message)) { sinSocio = true; ({error: e2} = await sb.from("crm_miembros").insert(poner.map(x => ({perfil_id: id, proyecto_id: x})))); }
      if (e2) return "Error al asignar proyectos: " + e2.message;
    }
    for (const x of sinSocio ? [] : cambiarSocio) { const {error: e3} = await sb.from("crm_miembros").update({socio: socioDe(x)}).eq("perfil_id", id).eq("proyecto_id", x); if (e3 && /socio/i.test(e3.message)) { sinSocio = true; break; } if (e3) return "Error al cambiar socio: " + e3.message; }
    if (sinSocio && document.querySelector("#p-proys [data-socio]:checked")) aviso("Proyectos asignados. La opción Socio aún no está activa en la base de datos: avisa a Claude.", true);
    await cargarTodo(); aviso("Guardado");
  });
}

/* ===== CONTACTOS ===== */
const normEmp = (t) => String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\b(s\.?l\.?u?|s\.?a\.?|sl|sa)\b/g, "").replace(/[^a-z0-9]+/g, " ").trim();
function contactosAgrupados() {
  const q = busqContactos.toLowerCase();
  const mapa = new Map();
  const ficha = (empresa) => { const k = normEmp(empresa); if (!mapa.has(k)) mapa.set(k, {empresa, contactos: [], cargo: "", telefono: "", email: "", leads: [], ventas: []}); return mapa.get(k); };
  leads.forEach(l => {
    const c = ficha(l.empresa);
    if (l.contacto && !c.contactos.includes(l.contacto)) c.contactos.push(l.contacto);
    c.cargo = c.cargo || l.cargo || ""; c.telefono = c.telefono || l.telefono || ""; c.email = c.email || l.email || "";
    c.leads.push(l);
  });
  ventas.forEach(v => ficha(v.cliente).ventas.push(v));
  return [...mapa.values()]
    .filter(c => filtroContProy === "todos" || c.leads.some(l => pasaFiltro(l.proyecto_id, filtroContProy)) || c.ventas.some(v => pasaFiltro(proyDeVenta(v), filtroContProy)))
    .filter(c => !q || [c.empresa, c.contactos.join(" "), c.cargo, c.telefono, c.email].join(" ").toLowerCase().includes(q))
    .sort((a, b) => (a.empresa || "").localeCompare(b.empresa || "", "es"));
}

function exportarContactos() {

/* ===== VENTAS (solo director; misma tabla que Agenda Central) ===== */
const ESTADO_VENTA = {pendiente: ["Factura pendiente", "p-mal"], cobrado: ["Factura cobrada", "p-aviso"], comision_cobrada: ["Comisión cobrada", "p-ok"]};
const ESTADO_FACTURA = {emitida: ["Emitida · pendiente de cobro", "p-aviso"], cobrada: ["Cobrada", "p-ok"], anulada: ["Anulada", "p-neutro"]};
const TIPO_FACTURA = {a_cuenta: "A cuenta", liquidacion: "Liquidación", rectificativa: "Rectificativa", otra: "Otra"};
const rectificadaPor = (f) => facturas.find(x => x.tipo === "rectificativa" && x.id !== f.id && x.numero.startsWith(f.numero) && x.estado !== "anulada");
function pildoraFactura(f) {
  const r = rectificadaPor(f);
  if (r) return `<span class="pildora p-neutro">Anulada por ${esc(r.numero)}</span>`;
  if (f.tipo === "rectificativa" && f.estado !== "anulada") return `<span class="pildora p-neutro">Rectificativa</span>`;
  const e = ESTADO_FACTURA[f.estado] || [f.estado, "p-neutro"];
  return `<span class="pildora ${e[1]}">${e[0]}</span>`;
}
const conIVA = (base, irpf = 7, iva = 21) => r2(base) + r2(base * iva / 100) - r2(base * irpf / 100);
function bloqueFacturas(vs) {
  const cuentasVentas = [...new Set(vs.map(v => cuentaDe(proyDeVenta(v))))];
  const fs = facturas.filter(f => filtroVentas === "todos" || cuentasVentas.includes(f.cuenta || "Elocrea"));
  const sum = (arr, f) => arr.reduce((s, x) => s + f(x), 0);
  const devengado = r2(sum(vs, aLiquidar));
  const vivas = fs.filter(f => f.estado !== "anulada");
  const facturado = r2(sum(vivas, f => +f.base || 0));
  const cobrado = r2(sum(vivas.filter(f => f.estado === "cobrada"), f => +f.base || 0));
  const pendCobro = r2(sum(vivas.filter(f => f.estado === "emitida" && f.tipo !== "rectificativa" && !rectificadaPor(f)), f => +f.base || 0));
  const pendFacturar = r2(devengado - facturado);
  const paula = r2(sum(vs.filter(v => v.liquidado_cdv != null), v => +v.liquidado_cdv - ingresoCDV(v)));
  return `<div class="bloque" style="margin-bottom:16px"><div class="bloque-cab"><h3>Facturas y cobros${filtroVentas === "todos" ? "" : " · " + esc(cuentasVentas.join(", "))}</h3><button class="btn" id="nueva-factura">+ Nueva factura</button></div>
    <div class="fila-liq"><span>Comisiones a facturar por CDV by JCerezo</span><b>${eur(devengado)}</b></div>
    ${paula > 0 ? `<div class="fila-liq sub"><span>incluye ${eur(paula)} de setters que cobra CDV by JCerezo y luego les paga</span></div>` : ""}
    <div class="fila-liq"><span>Facturado neto (${vivas.length} ${vivas.length === 1 ? "factura" : "facturas"}, con rectificativas)</span><b>${eur(facturado)}</b></div>
    <div class="fila-liq"><span>Cobrado</span><b style="color:var(--bien)">${eur(cobrado)}</b></div>
    ${pendCobro > 0 ? `<div class="fila-liq"><span>Facturado y pendiente de cobro</span><b style="color:var(--aviso)">${eur(pendCobro)}</b></div>` : ""}
    <div class="fila-liq total"><span>Pendiente de facturar a la liquidación final</span><b>${eur(pendFacturar)}<small>${eur(conIVA(pendFacturar))} con IVA 21 % y retención IRPF 7 %</small></b></div>
    <div class="tabla-env" style="margin-top:12px"><table><thead><tr><th>Nº factura</th><th>Fecha</th><th>Concepto</th><th>Tipo</th><th class="num">Base</th><th class="num">IRPF</th><th class="num">IVA</th><th class="num">Total</th><th>Estado</th></tr></thead><tbody>
    ${fs.length ? fs.map(f => { return `<tr class="clic" data-factura="${f.id}"><td><b style="font-weight:600">${esc(f.numero)}</b></td><td>${fF(f.fecha)}</td><td>${esc(f.concepto || "")}<small style="display:block;color:var(--texto3)">${esc(f.cliente || "")}</small></td><td>${TIPO_FACTURA[f.tipo] || esc(f.tipo)}</td><td class="num">${eur(f.base)}</td><td class="num">${eur(-f.irpf)}</td><td class="num">${eur(f.iva)}</td><td class="num"><b>${eur(f.total)}</b></td><td>${pildoraFactura(f)}</td></tr>`; }).join("") : `<tr><td colspan="9">Todavía no hay facturas registradas.</td></tr>`}
    </tbody></table></div></div>`;
}

  <div class="tabla-env"><table><thead><tr><th>Cliente</th><th>Producto</th><th class="num">Importe</th><th>Closer</th><th>Setter</th><th class="num">Com. closer</th><th class="num">Com. setter</th><th class="num">Tu parte</th><th>Estado</th></tr></thead><tbody>
  ${vs.map(v => { const id = proyDeVenta(v), e = ESTADO_VENTA[v.estado] || [v.estado, "p-neutro"];
    return `<tr><td>${esc(v.cliente)}${v.notas ? `<small style="display:block;color:var(--texto3);max-width:260px;white-space:normal">${esc(v.notas)}</small>` : ""}</td><td><span class="area dir">${id ? etiquetaProy(id) : esc(v.proyecto || "—")}</span></td><td class="num">${eur(v.importe)}</td><td>${esc([v.closer, v.closer2].filter(Boolean).join(" + ") || "—")}</td><td>${esc(v.setter || "—")}</td><td class="num">${eur((+v.com_closer || 0) + (+v.com_closer2 || 0))}</td><td class="num">${eur(v.com_setter)}</td><td class="num"><b style="font-weight:600">${eur(mia(v))}</b></td><td><span class="pildora ${e[1]}">${e[0]}</span></td></tr>`; }).join("") || `<tr><td colspan="9">No hay ventas con este filtro.</td></tr>`}
  </tbody></table></div>
  <p style="font-size:12px;color:var(--texto3);margin-top:10px">Las ventas las registra Javier. Si falta alguna o ves un importe que no cuadra, díselo.</p>`;
}
function editarFactura(id) {
  const f = id ? facturas.find(x => x.id === id) : null;
  const sig = (() => { const d = new Date(); const pre = d.getFullYear() + "/" + String(d.getMonth() + 1).padStart(2, "0") + "-"; const n = facturas.filter(x => x.numero.startsWith(pre)).length + 1; return pre + n; })();
  modal(`<h3>${f ? "Factura " + esc(f.numero) : "Nueva factura"}</h3>
    <div class="rejilla-campos">
      <div class="campo"><label for="fa-num">Nº factura *</label><input id="fa-num" required value="${esc(f ? f.numero : sig)}"></div>
      <div class="campo"><label for="fa-fecha">Fecha *</label><input id="fa-fecha" type="date" required value="${f ? f.fecha : fechaISO(new Date())}"></div>
      <div class="campo"><label for="fa-cliente">Cliente</label><input id="fa-cliente" value="${esc(f ? f.cliente : "ELOCREA S.L.")}"></div>
      <div class="campo"><label for="fa-cuenta">Cuenta</label><select id="fa-cuenta">${[...new Set(proyectos.map(p => p.cuenta).filter(Boolean))].map(c => `<option ${(f ? f.cuenta : "Elocrea") === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></div>
      <div class="campo" style="grid-column:1/-1"><label for="fa-concepto">Concepto</label><input id="fa-concepto" value="${esc(f ? f.concepto || "" : "Comisiones a cuenta")}"></div>
      <div class="campo"><label for="fa-tipo">Tipo</label><select id="fa-tipo">${Object.entries(TIPO_FACTURA).map(([k, v]) => `<option value="${k}" ${(f ? f.tipo : "a_cuenta") === k ? "selected" : ""}>${v}</option>`).join("")}</select></div>
      <div class="campo"><label for="fa-base">Base imponible (€) *</label><input id="fa-base" type="number" step="0.01" required value="${f ? f.base : ""}"></div>
      <div class="campo"><label for="fa-irpf">IRPF %</label><input id="fa-irpf" type="number" step="0.01" min="0" value="${f ? f.irpf_pct : 7}"></div>
      <div class="campo"><label for="fa-iva">IVA %</label><input id="fa-iva" type="number" step="0.01" min="0" value="${f ? f.iva_pct : 21}"></div>
      <div class="campo"><label for="fa-estado">Estado</label><select id="fa-estado">${Object.entries(ESTADO_FACTURA).map(([k, v]) => `<option value="${k}" ${(f ? f.estado : "emitida") === k ? "selected" : ""}>${v[0]}</option>`).join("")}</select></div>
      <div class="campo"><label for="fa-cobro">Fecha de cobro</label><input id="fa-cobro" type="date" value="${f && f.fecha_cobro ? f.fecha_cobro : ""}"></div>
      <div class="campo" style="grid-column:1/-1"><label for="fa-notas">Notas</label><textarea id="fa-notas">${esc(f ? f.notas || "" : "")}</textarea></div>
      <p class="nota-ejemplo" id="fa-total" style="grid-column:1/-1"></p>
    </div>`, async () => {
    const base = parseFloat($("#fa-base").value); if (isNaN(base)) return "Indica la base imponible (en negativo si es una rectificativa).";
    const fila = {numero: $("#fa-num").value.trim(), fecha: $("#fa-fecha").value, cliente: $("#fa-cliente").value.trim() || "ELOCREA S.L.", cuenta: $("#fa-cuenta").value,
      concepto: $("#fa-concepto").value.trim() || null, tipo: $("#fa-tipo").value, base: r2(base), irpf_pct: +$("#fa-irpf").value || 0, iva_pct: +$("#fa-iva").value || 0,
      estado: $("#fa-estado").value, fecha_cobro: $("#fa-cobro").value || null, notas: $("#fa-notas").value.trim() || null};
    if (!fila.numero || !fila.fecha) return "Nº de factura y fecha son obligatorios.";
    const q = f ? sb.from("facturas").update(fila).eq("id", f.id) : sb.from("facturas").insert(fila);
    const {data, error} = await q.select().single();
    if (error) return "No se pudo guardar: " + error.message;
    if (f) Object.assign(f, data); else facturas.push(data);
    facturas.sort((a, b) => String(a.fecha).localeCompare(String(b.fecha)));
    aviso(f ? "Factura actualizada" : "Factura registrada");
  }, f ? "Guardar" : "Registrar factura");
  const calc = () => { const b = +$("#fa-base").value || 0, ir = +$("#fa-irpf").value || 0, iv = +$("#fa-iva").value || 0; $("#fa-total").textContent = `Total a cobrar: ${eur(conIVA(b, ir, iv))} (base ${eur(b)} + IVA ${eur(b * iv / 100)} − IRPF ${eur(b * ir / 100)})`; };
  ["#fa-base", "#fa-irpf", "#fa-iva"].forEach(k => $(k).oninput = calc); calc();
  if (f) {
    const acc = $(".modal-acciones");
    const b = document.createElement("button"); b.type = "button"; b.className = "btn"; b.style.color = "var(--mal)"; b.style.marginRight = "auto"; b.textContent = "Borrar";
    b.onclick = async () => {
      if (!confirm("¿Borrar la factura " + f.numero + "? Quedará en el historial de cambios.")) return;
      const {error} = await sb.from("facturas").delete().eq("id", f.id);
      if (error) return fallo(error, "No se pudo borrar");
      facturas = facturas.filter(x => x.id !== f.id); cerrarCapa(); render(); aviso("Factura borrada");
    };
    acc.prepend(b);
  }
}

/* ===== CALENDARIO ===== */
const colorPersona = (id) => { const ids = [...new Set([...perfiles.map(p => p.id), ...equipo.map(p => p.id)])]; return COLORES_PERSONA[Math.max(0, ids.indexOf(id)) % COLORES_PERSONA.length]; };
const horaTxt = (s) => new Date(s).toLocaleTimeString("es-ES", {hour: "2-digit", minute: "2-digit"});
function lunesDe(offset) { const d = hoy(); const dia = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dia + offset * 7); return d; }
function reunionesVisibles() {
  return reuniones.filter(r => r.estado !== "cancelada").filter(r => filtroPersona === "todos" || filtroPersona === "sin" || r.responsable_id === filtroPersona);
}
function itemReunion(r, conFecha) {
  const l = leads.find(x => x.id === r.lead_id);
  const color = colorPersona(r.responsable_id);
  return `<div class="lead" role="button" tabindex="0" data-reunion="${r.id}" style="border-left:3px solid ${color};${r.estado === "hecha" ? "opacity:.6" : ""}">
    <span class="lead-sup"><span class="lead-nom"><b>${horaTxt(r.inicio)}–${horaTxt(r.fin)}${conFecha ? " · " + fF(r.inicio) : ""}</b><small>${esc(TIPOS_REUNION[r.tipo] || "Reunión")}${r.estado === "hecha" ? " · hecha" : ""}</small></span></span>
    <span class="lead-serv"><span>${esc(r.titulo)}</span></span>
    ${l || r.proyecto_id ? `<span class="lead-cta">${l ? esc(l.empresa) + " · " : ""}${esc(nomProy(r.proyecto_id || (l && l.proyecto_id)))}</span>` : ""}
    ${esDir() || r.responsable_id !== yo.id ? `<span class="lead-cta" style="color:${color}">● ${esc(nomPersona(r.responsable_id))}</span>` : ""}
  </div>`;
}
function bloqueReunionesHoy() {
  const h = hoy(), m = new Date(h); m.setDate(m.getDate() + 1);
  const deHoy = reunionesVisibles().filter(r => new Date(r.inicio) >= h && new Date(r.inicio) < m);
  return `<section class="bloque" style="margin-bottom:16px"><div class="bloque-cab"><h3>Reuniones de hoy${esDir() ? " del equipo" : ""}</h3><button class="btn-texto" data-vista="calendario">Abrir calendario →</button></div>
    ${deHoy.length ? `<div class="tarjetas" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px">${deHoy.map(r => itemReunion(r)).join("")}</div>` : `<p class="vacia">No hay reuniones hoy.</p>`}</section>`;
}
function vCalendario() {
  const ini = lunesDe(semana), dias = [...Array(7)].map((_, i) => { const d = new Date(ini); d.setDate(d.getDate() + i); return d; });
  const fin = new Date(ini); fin.setDate(fin.getDate() + 7);
  const rs = reunionesVisibles().filter(r => new Date(r.inicio) >= ini && new Date(r.inicio) < fin);
  const personas = esDir() ? perfiles.filter(p => p.activo) : [];
  const titulo = dias[0].toLocaleDateString("es-ES", {day: "numeric", month: "long"}) + " – " + dias[6].toLocaleDateString("es-ES", {day: "numeric", month: "long", year: "numeric"});
  const hoyISO = fechaISO(new Date());
  return `<div class="cabecera"><div><h2>Calendario</h2><div class="sub">${esDir() ? "Reuniones de todo el equipo, con el color de cada comercial" : "Tus reuniones"} · ${rs.length} esta semana</div></div><button class="btn btn-oro" data-nueva-reunion>+ Nueva reunión</button></div>
  <div class="barra-herr"><div class="izq" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <button class="btn" data-semana="-1" aria-label="Semana anterior">←</button><button class="btn" data-semana="0">Hoy</button><button class="btn" data-semana="1" aria-label="Semana siguiente">→</button>
    <b style="margin-left:6px">${titulo}</b></div>
    <div class="der">${esDir() ? `<select class="entrada" id="f-persona" aria-label="Comercial"><option value="todos">Todo el equipo</option>${personas.map(p => `<option value="${p.id}" ${filtroPersona === p.id ? "selected" : ""}>${esc(p.nombre)}</option>`).join("")}</select>` : ""}</div></div>
  ${esDir() && personas.length > 1 ? `<div class="filtros" style="margin-bottom:10px">${personas.map(p => `<span class="chip" style="border-color:${colorPersona(p.id)}"><span style="color:${colorPersona(p.id)}">●</span> ${esc(p.nombre)}</span>`).join("")}</div>` : ""}
  <div class="kanban-scroll"><div class="kanban">${dias.map(d => {
    const iso = fechaISO(d), del = rs.filter(r => fechaISO(new Date(r.inicio)) === iso).sort((a, b) => a.inicio.localeCompare(b.inicio));
    return `<section class="columna ${iso === hoyISO ? "final" : ""}"><div class="col-cab"><div class="col-tit"><h3 style="text-transform:capitalize">${d.toLocaleDateString("es-ES", {weekday: "long"})}</h3><span class="cnt">${d.getDate()} ${d.toLocaleDateString("es-ES", {month: "short"})}</span></div><div class="col-val"><span>${del.length ? del.length + (del.length === 1 ? " reunión" : " reuniones") : "Libre"}</span></div></div>
      <div class="tarjetas">${del.map(r => itemReunion(r)).join("")}<button class="btn-texto" data-nueva-reunion data-fecha="${iso}" style="align-self:center">+ Añadir</button></div></section>`;
  }).join("")}</div></div>`;
}
function editarReunion(id, pre = {}) {
  const r = id ? reuniones.find(x => x.id === id) : null;
  const personas = esDir() ? perfiles.filter(p => p.activo) : [yo];
  const misLeads = leads.filter(l => l.etapa !== PERDIDO && l.etapa !== NO_INTERESA).sort((a, b) => a.empresa.localeCompare(b.empresa, "es"));
  const leadSel = r ? r.lead_id : pre.lead_id || null;
  const ini = r ? new Date(r.inicio) : (() => { const d = pre.fecha ? new Date(pre.fecha + "T10:00") : new Date(); if (!pre.fecha) { d.setHours(d.getHours() + 1, 0, 0, 0); } return d; })();
  const dur = r ? Math.round((new Date(r.fin) - new Date(r.inicio)) / 60000) : 60;
  const hh = (d) => String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  const lPre = misLeads.find(l => l.id === leadSel);
  modal(`<h3>${r ? "Editar reunión" : "Nueva reunión"}</h3>
    <div class="rejilla-campos">
      <div class="campo" style="grid-column:1/-1"><label for="r-titulo">Asunto *</label><input id="r-titulo" required value="${esc(r ? r.titulo : lPre ? "Reunión con " + lPre.empresa : "")}"></div>
      <div class="campo"><label for="r-lead">Lead / empresa</label><select id="r-lead"><option value="">Sin lead</option>${misLeads.map(l => `<option value="${l.id}" ${l.id === leadSel ? "selected" : ""}>${esc(l.empresa)} · ${esc(nomProy(l.proyecto_id))}</option>`).join("")}</select></div>
      <div class="campo"><label for="r-tipo">Tipo</label><select id="r-tipo">${Object.entries(TIPOS_REUNION).map(([k, v]) => `<option value="${k}" ${(r ? r.tipo : "reunion") === k ? "selected" : ""}>${v}</option>`).join("")}</select></div>
      <div class="campo"><label for="r-fecha">Fecha *</label><input id="r-fecha" type="date" required value="${fechaISO(ini)}"></div>
      <div class="campo"><label for="r-hora">Hora *</label><input id="r-hora" type="time" required value="${hh(ini)}"></div>
      <div class="campo"><label for="r-dur">Duración</label><select id="r-dur">${[15, 30, 45, 60, 90, 120, 180].map(m => `<option value="${m}" ${m === dur ? "selected" : ""}>${m < 60 ? m + " min" : (m / 60).toString().replace(".", ",") + " h"}</option>`).join("")}</select></div>
      <div class="campo"><label for="r-resp">Quién la lleva</label><select id="r-resp" ${esDir() ? "" : "disabled"}>${personas.map(p => `<option value="${p.id}" ${(r ? r.responsable_id : yo.id) === p.id ? "selected" : ""}>${esc(p.nombre)}</option>`).join("")}</select></div>
      <div class="campo" style="grid-column:1/-1"><label for="r-lugar">Lugar o enlace</label><input id="r-lugar" value="${esc(r ? r.lugar || "" : "")}" placeholder="Dirección, Meet, Zoom, teléfono…"></div>
      <div class="campo" style="grid-column:1/-1"><label for="r-notas">Notas</label><textarea id="r-notas">${esc(r ? r.notas || "" : "")}</textarea></div>
      ${r ? `<div class="campo"><label for="r-estado">Estado</label><select id="r-estado">${[["programada", "Programada"], ["hecha", "Hecha"], ["cancelada", "Cancelada"]].map(([k, v]) => `<option value="${k}" ${r.estado === k ? "selected" : ""}>${v}</option>`).join("")}</select></div>` : ""}
    </div>`, async () => {
    const titulo = $("#r-titulo").value.trim(); if (!titulo) return "El asunto es obligatorio.";
    const f = $("#r-fecha").value, h = $("#r-hora").value; if (!f || !h) return "Indica fecha y hora.";
    const inicio = new Date(f + "T" + h), fin = new Date(inicio.getTime() + (+$("#r-dur").value) * 60000);
    const lead_id = $("#r-lead").value ? +$("#r-lead").value : null;
    const l = leads.find(x => x.id === lead_id);
    const fila = {titulo, lead_id, proyecto_id: l ? l.proyecto_id : null, tipo: $("#r-tipo").value, inicio: inicio.toISOString(), fin: fin.toISOString(),
      lugar: $("#r-lugar").value.trim() || null, notas: $("#r-notas").value.trim() || null, responsable_id: esDir() ? $("#r-resp").value : yo.id};
    if (r) fila.estado = $("#r-estado").value;
    const q = r ? sb.from("crm_reuniones").update(fila).eq("id", r.id) : sb.from("crm_reuniones").insert(fila);
    const {data, error} = await q.select().single();
    if (error) return "No se pudo guardar: " + error.message;
    if (r) Object.assign(r, data); else reuniones.push(data);
    if (!r && l) {
      await sb.from("crm_actividad").insert({lead_id: l.id, autor_id: yo.id, tipo: "paso", texto: `${TIPOS_REUNION[fila.tipo]} programada: ${fF(fila.inicio)} ${horaTxt(fila.inicio)}`});
      if (!l.proximo_paso_fecha || l.proximo_paso_fecha > fechaISO(inicio) || difDias(l.proximo_paso_fecha) < 0) {
        const {data: ld} = await sb.from("crm_leads").update({proximo_paso: TIPOS_REUNION[fila.tipo] + ": " + titulo, proximo_paso_fecha: fechaISO(inicio)}).eq("id", l.id).select().single();
        if (ld) Object.assign(l, ld);
      }
    }
    aviso(r ? "Reunión actualizada" : "Reunión programada");
  }, r ? "Guardar" : "Programar");
  if (r) {
    const acc = $(".modal-acciones");
    const b = document.createElement("button"); b.type = "button"; b.className = "btn"; b.style.color = "var(--mal)"; b.style.marginRight = "auto"; b.textContent = "Borrar";
    b.onclick = async () => {
      if (!confirm("¿Borrar esta reunión?")) return;
      const {error} = await sb.from("crm_reuniones").delete().eq("id", r.id);
      if (error) return fallo(error, "No se pudo borrar");
      reuniones = reuniones.filter(x => x.id !== r.id); cerrarCapa(); render(); aviso("Reunión borrada");
    };
    acc.prepend(b);
  }
}

/* ===== INICIO ===== */
document.querySelectorAll(".lateral [data-vista], .barra-movil [data-vista]").forEach(b => b.onclick = () => { vista = b.dataset.vista; cerrarCapa(); render(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") cerrarCapa(); });
sb.auth.onAuthStateChange((evento) => { if (evento === "PASSWORD_RECOVERY") pantallaAcceso("nueva"); });
(async () => {
  if (location.hash.includes("type=recovery")) return; // lo gestiona onAuthStateChange
  const {data: {session}} = await sb.auth.getSession();
  if (session) arrancar(); else pantallaAcceso("entrar");
})();
</script>
</body>
</html>
